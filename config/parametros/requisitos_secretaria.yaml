# =============================================================================
# REQUISITOS POR TRÁMITE — listado de la Secretaría de Planeación y Desarrollo
# Territorial de El Carmen de Viboral (entregado el 2026-11-23).
#
# Cada lista dice a qué trámites aplica (tipos), y si hace falta, a qué
# modalidad o clase de suelo. Se usa la PRIMERA lista que coincida, por eso
# las más específicas van primero.
#
# Cada requisito:
#   doc:      clave del catálogo (tramites.yaml → documentos.catalogo).
#             "a|b" = se cumple con cualquiera de los dos.
#   texto:    cómo aparece en el listado (si difiere del catálogo).
#   cond:     solo se exige si se da la condición: juridica, apoderado, ph,
#             en_parcelacion, lote_icanh, urbano, rural.
#   regla:    el programa decide el documento: suelos_urbano, suelos_rural.
#   opcional: true = "si aplica": aparece en la lista, pero no bloquea.
#   nota:     aclaración que se muestra al usuario.
# =============================================================================
metadatos:
  norma: Listado de requisitos de la Secretaría de Planeación y Desarrollo Territorial
  prevalencia: "Requisitos documentales internos. No reemplazan el Decreto 1077 de 2015 ni la Resolución 462 de 2017 del MinVivienda."

criterios:
  urbano_pisos_estudio_suelos:
    valor: 3
    unidad: pisos
    nota: "Estudio de suelos según NSR-10 para edificaciones de 3 a 6 pisos; apique según NSR-10 para edificaciones en 2 niveles (o menos)."
    fuente: {norma: Listado de requisitos de la Secretaría, articulo: "Construcción en zona urbana, núms. 4 y 5"}
  rural_area_estudio_suelos:
    valor: 300
    unidad: m² a construir
    nota: "Estudio de suelos si el área a construir es igual o mayor a 300 m², si son dos niveles y mansarda, en parcelaciones o si lo exige el reglamento de propiedad horizontal. Casas de uno y dos pisos: apique."
    fuente: {norma: Listado de requisitos de la Secretaría, articulo: "Construcción en zona rural, núm. 5"}
  cambio_uso_garaje_frente_minimo:
    valor: 3.0
    unidad: m
    nota: "Cambio de uso de garaje a local comercial: primero visita técnica para verificar frente y área."
    fuente: {norma: Listado de requisitos de la Secretaría, articulo: "Licencia de modificación por cambio de uso de garaje a local comercial"}
  cambio_uso_garaje_area_minima:
    valor: 9.0
    unidad: m²
    fuente: {norma: Listado de requisitos de la Secretaría, articulo: "Licencia de modificación por cambio de uso de garaje a local comercial"}

listas:
  valor:
    # ------------------------------------------------------------ licencias
    construccion_urbana:
      titulo: Documentación para construcción en zona urbana
      tipos: [construccion_urbana]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: informe_alineamiento|factibilidad_servicios, texto: "Informe de alineamiento o factibilidades de servicios públicos de energía (EPM) y acueducto (La Cimarrona E.S.P.)"}
        - {doc: estudio_suelos, regla: suelos_urbano, texto: "Estudio de suelos según NSR-10 (3 a 6 pisos) o apique según NSR-10 (2 niveles)"}
        - {doc: autorizacion_copropiedad, cond: ph, texto: "Autorización de la copropiedad (si existe reglamento de propiedad horizontal)"}
        - {doc: fun, texto: Formato Único Nacional debidamente diligenciado}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: camara_comercio, cond: juridica}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}
        - {doc: planos_estructurales, texto: Tres copias de diseños estructurales}
        - {doc: memorias_calculo, texto: Memorias de cálculo}
        - {doc: formato_memorias}
        - {doc: formato_revision_estructural}
        - {doc: planos_hidrosanitarios}
        - {doc: medio_magnetico}
        - {doc: profesionales, texto: Copia de la matrícula de los profesionales}
        - {doc: vecinos, texto: Cartas de vecinos colindantes}
        - {doc: foto_valla, texto: Foto de la valla instalada}
        - {doc: firma_suelista}
        - {doc: poder, cond: apoderado, texto: Poder autenticado en notaría (si no tramita el titular)}

    construccion_rural:
      titulo: Documentación para construcción en zona rural
      tipos: [construccion_rural]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: informe_alineamiento|factibilidad_servicios, texto: "Informe de alineamiento y/o factibilidades de servicios públicos (EPM y acueducto veredal)"}
        - {doc: estudio_suelos, regla: suelos_rural, texto: "Estudio de suelos según NSR-10 o apique (según área, niveles, parcelación y PH)"}
        - {doc: aprobacion_parcelacion, cond: en_parcelacion}
        - {doc: fun, texto: Formulario Único Nacional debidamente diligenciado}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: camara_comercio, cond: juridica}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}
        - {doc: planos_estructurales, texto: Tres copias de diseños estructurales}
        - {doc: memorias_calculo, texto: Memorias de cálculo}
        - {doc: formato_memorias}
        - {doc: formato_revision_estructural}
        - {doc: pozo_septico|vertimientos, texto: "Diseño estructural del pozo séptico (o ficha técnica si es prefabricado), o permiso de vertimientos de Cornare"}
        - {doc: planos_hidrosanitarios}
        - {doc: medio_magnetico}
        - {doc: profesionales, texto: Copia de la matrícula de los profesionales}
        - {doc: foto_valla}
        - {doc: firma_suelista}
        - {doc: poder, cond: apoderado, texto: Poder autenticado en notaría (si no tramita el titular)}

    parcelacion:
      titulo: Documentación para licencia de parcelación
      tipos: [parcelacion]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: informe_alineamiento}
        - {doc: estudio_suelos}
        - {doc: fun}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: camara_comercio, cond: juridica}
        - {doc: icanh, cond: lote_icanh, nota: "Predios ≥ 10.000 m². El listado cita el Decreto 763 de 2009."}
        - {doc: levantamiento_topografico, texto: Tres copias del levantamiento topográfico}
        - {doc: diseno_urbanistico, texto: "Tres copias del diseño arquitectónico de parcelación (vías, loteo, secciones viales)"}
        - {doc: pma, texto: Plan de Manejo Ambiental según términos de referencia de Cornare}
        - {doc: vertimientos}
        - {doc: medio_magnetico}

    urbanizacion:
      titulo: Documentación para licencia de urbanismo
      tipos: [urbanizacion]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: informe_alineamiento}
        - {doc: estudio_suelos}
        - {doc: fun}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: camara_comercio, cond: juridica}
        - {doc: icanh, cond: lote_icanh, nota: "Predios ≥ 10.000 m². El listado cita el Decreto 763 de 2009."}
        - {doc: levantamiento_topografico, texto: Tres copias del levantamiento topográfico}
        - {doc: diseno_urbanistico, texto: "Tres copias del diseño arquitectónico del urbanismo (vías, loteo, secciones viales)"}
        - {doc: pma, texto: "Plan de Manejo Ambiental según términos de referencia de Cornare (con radicado de Cornare)"}
        - {doc: medio_magnetico}

    cambio_uso:
      titulo: Adición y/o modificación — cambio de uso
      tipos: [adicion_modificacion_cambio_uso]
      modalidades: [cambio_de_uso]
      requisitos:
        - {doc: visita_tecnica, opcional: true, texto: "Visita técnica previa (cambio de garaje a local: frente ≥ 3 m y área ≥ 9 m²)"}
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: autorizacion_copropiedad, cond: ph}
        - {doc: fun}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: camara_comercio, cond: juridica}
        - {doc: licencia_anterior, texto: Copia de la licencia de la construcción existente}
        - {doc: certificado_estructural, opcional: true, texto: "Certificación estructural (si aplica o si hubo modificación interna)"}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}

    adicion_modificacion:
      titulo: Documentos para licencia de adición y/o modificación
      tipos: [adicion_modificacion_cambio_uso]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: informe_alineamiento}
        - {doc: autorizacion_copropiedad, cond: ph}
        - {doc: fun}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: camara_comercio, cond: juridica}
        - {doc: licencia_anterior, texto: Copia de la licencia de la construcción existente}
        - {doc: certificado_estructural, opcional: true, texto: Certificación estructural (si aplica)}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}
        - {doc: planos_estructurales, texto: Tres copias de diseños estructurales}
        - {doc: memorias_calculo}
        - {doc: formato_memorias}
        - {doc: formato_revision_estructural}
        - {doc: medio_magnetico}

    cerramiento:
      titulo: Documentos para licencia de cerramiento
      tipos: [cerramiento]
      nota: "El listado trae dos versiones de cerramiento; aquí están unidas. Quite lo que no aplique desde Parámetros."
      requisitos:
        - {doc: visita_tecnica, texto: Visita de las técnicas}
        - {doc: informe_visita}
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: informe_alineamiento}
        - {doc: fun, texto: "Formulario Único Nacional, anexando los vecinos colindantes para su notificación"}
        - {doc: identificacion, texto: Fotocopia de la cédula (o representación legal si es empresa)}
        - {doc: camara_comercio, cond: juridica}
        - {doc: plano_localizacion_cerramiento}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}
        - {doc: planos_estructurales, texto: Tres copias de diseños estructurales}
        - {doc: memorias_calculo}
        - {doc: formato_memorias}
        - {doc: formato_revision_estructural}
        - {doc: medio_magnetico}

    prorroga:
      titulo: Documentos para prórroga de licencia
      tipos: [prorroga]
      requisitos:
        - {doc: solicitud_prorroga}
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: licencia_anterior, texto: Fotocopia de la resolución anterior}

    subdivision:
      titulo: Documentos para licencia de subdivisión predial
      tipos: [subdivision]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: fun}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: camara_comercio, cond: juridica}
        - {doc: levantamiento_topografico, texto: Tres copias del levantamiento topográfico}
        - {doc: medio_magnetico}
        - {doc: profesionales, texto: Copia de la matrícula de los profesionales}

    reconocimiento_rural:
      titulo: Licencia de reconocimiento rural
      tipos: [reconocimiento]
      clase_suelo: [rural, suburbano]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}
        - {doc: facturas_servicios, texto: Facturas de los servicios de acueducto y energía}
        - {doc: ubicacion_pozo_septico}
        - {doc: declaracion_extrajuicio, texto: Declaración extrajuicio de que la casa lleva más de cinco años construida}
        - {doc: fun}
        - {doc: certificado_estructural}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: profesionales, texto: Copia de la matrícula de los profesionales}

    reconocimiento_urbano:
      titulo: Licencia de reconocimiento urbana
      tipos: [reconocimiento]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}
        - {doc: informe_alineamiento}
        - {doc: factibilidad_servicios|facturas_servicios, texto: Factibilidades de servicios públicos o facturas}
        - {doc: declaracion_extrajuicio}
        - {doc: fun}
        - {doc: certificado_estructural}
        - {doc: autorizacion_copropiedad, cond: ph, texto: Autorización emitida por la copropiedad}
        - {doc: identificacion, texto: Fotocopia de la cédula de cada uno de los propietarios}
        - {doc: profesionales, texto: Copia de la matrícula de los profesionales}

    legalizacion_rural:
      titulo: Licencia de legalización rural
      tipos: [legalizacion]
      clase_suelo: [rural, suburbano]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}
        - {doc: informe_alineamiento|facturas_servicios, texto: "Informe de alineamiento y/o facturas de servicios públicos (agua y energía)"}
        - {doc: pozo_septico|vertimientos, texto: Diseño del pozo séptico o permiso de vertimientos de Cornare}
        - {doc: fun}
        - {doc: certificado_estructural}

    legalizacion_urbana:
      titulo: Licencia de legalización urbana
      tipos: [legalizacion]
      requisitos:
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: planos_arquitectonicos, texto: Tres copias de diseños arquitectónicos}
        - {doc: informe_alineamiento|factibilidad_servicios|facturas_servicios, texto: "Informe de alineamiento (si no lo tiene: factibilidades de servicios públicos o facturas)"}
        - {doc: fun, texto: Formulario Único Nacional total y debidamente diligenciado}
        - {doc: certificado_estructural}
        - {doc: autorizacion_copropiedad, cond: ph}
        - {doc: identificacion, texto: Fotocopia del documento de identidad de los titulares}
        - {doc: profesionales, texto: "Matrícula de los profesionales intervinientes y certificaciones de experiencia, cuando se requieran"}

    recibo_obras_urbanismo:
      titulo: Requisitos para recibir el urbanismo
      tipos: [recibo_obras_urbanismo]
      requisitos:
        - {doc: actas_empresas, texto: "Recibo de las redes de acueducto, alcantarillado y energía por las empresas públicas"}
        - {doc: polizas, texto: Pólizas de estabilidad}
        - {doc: planos_record, texto: Planos récord del urbanismo}
        - {doc: cert_tradicion}
        - {doc: camara_comercio, texto: Certificado de cámara de comercio vigente}
        - {doc: fun}
        - {doc: paz_salvo}

    permiso_ventas:
      titulo: Requisitos para el permiso de ventas
      tipos: [permiso_ventas]
      nota: "El listado remite al art. 179 del Decreto 019 de 2012."
      requisitos:
        - {doc: cert_tradicion}
        - {doc: presupuesto, texto: Presupuesto financiero firmado por el titular y el contador público}
        - {doc: licencia_anterior, texto: Fotocopia de la licencia de construcción}
        - {doc: identificacion, texto: Fotocopia de la cédula de ciudadanía}
        - {doc: levantamiento_hipoteca, opcional: true}

    aprobacion_ph:
      titulo: Aprobación de los planos de propiedad horizontal
      tipos: [aprobacion_ph]
      requisitos:
        - {doc: cert_tradicion, nota: "Si el predio no se ha desenglobado, puede ser el del predio de mayor extensión."}
        - {doc: identificacion|camara_comercio, texto: Documento de identidad (persona natural) o certificado de existencia y representación legal (persona jurídica)}
        - {doc: poder, cond: apoderado, texto: Poder o autorización cuando se actúa por apoderado}
        - {doc: planos_alinderamiento}
        - {doc: cuadro_areas, texto: Cuadro de áreas o proyecto de división}
        - {doc: licencia_anterior, opcional: true, texto: "Copia de la licencia y planos (si se presenta ante autoridad distinta a la que la otorgó)"}
        - {doc: declaracion_juramentada, opcional: true}

    # --------------------------------------------- certificados y otros
    alineamiento:
      titulo: Documentos para informe de alineamiento
      tipos: [alineamiento]
      requisitos:
        - {doc: certificado_catastro}
        - {doc: factibilidad_acueducto}
        - {doc: factibilidad_energia}
        - {doc: pago_tramite, texto: Pago del alineamiento}
        - {doc: solicitud_tramite, texto: Solicitud de alineamiento diligenciada}
        - {doc: identificacion, texto: Fotocopia de la cédula del propietario del predio o la vivienda}

    certificado_riesgo:
      titulo: Certificado de alto riesgo
      tipos: [certificado_riesgo]
      requisitos:
        - {doc: visita_tecnica, texto: Visita domiciliaria}
        - {doc: certificado_catastro}
        - {doc: pago_tramite, texto: Pago del certificado de alto riesgo}
        - {doc: solicitud_tramite}

    concepto_uso:
      titulo: Concepto de usos del suelo
      tipos: [concepto_uso]
      requisitos:
        - {doc: certificado_catastro}
        - {doc: pago_tramite, texto: Pago del certificado de usos del suelo}
        - {doc: solicitud_tramite}

    desenglobe:
      titulo: Certificado de desenglobe
      tipos: [desenglobe]
      requisitos:
        - {doc: certificado_catastro}
        - {doc: pago_nomenclatura}
        - {doc: pago_tramite, texto: Pago del certificado de desenglobe}
        - {doc: visita_tecnica, texto: Visita domiciliaria}

    nomenclatura_dian:
      titulo: Certificado de nomenclatura DIAN
      tipos: [nomenclatura_dian]
      requisitos:
        - {doc: certificado_catastro}
        - {doc: solicitud_tramite}

    nomenclatura:
      titulo: Certificado de nomenclatura
      tipos: [nomenclatura]
      requisitos:
        - {doc: certificado_catastro}
        - {doc: pago_nomenclatura, texto: Pago del certificado de nomenclatura}
        - {doc: solicitud_tramite}
        - {doc: visita_tecnica, texto: Visita domiciliaria}

    estrato:
      titulo: Certificado de estrato
      tipos: [estrato]
      requisitos:
        - {doc: certificado_catastro}
        - {doc: pago_tramite, texto: Pago del estrato}
        - {doc: pago_nomenclatura, cond: urbano, texto: Pago del certificado de nomenclatura (zona urbana)}
        - {doc: visita_tecnica, texto: Visita domiciliaria}

    reclamo_estrato:
      titulo: Reclamos de estratificación
      tipos: [reclamo_estrato]
      requisitos:
        - {doc: formato_reclamo_estrato}
        - {doc: facturas_servicios, texto: "Facturas de servicios públicos (energía, acueducto, alcantarillado y gas)"}
        - {doc: impuesto_predial}

    correccion_nomenclatura:
      titulo: Corrección de nomenclatura
      tipos: [correccion_nomenclatura]
      requisitos:
        - {doc: certificado_catastro}
        - {doc: facturas_servicios, texto: Factura de todos los servicios públicos}
        - {doc: solicitud_tramite}
        - {doc: visita_tecnica, texto: Visita domiciliaria}

    apertura_vanos:
      titulo: Apertura de puertas y ventanas (vanos)
      tipos: [apertura_vanos]
      requisitos:
        - {doc: visita_tecnica, texto: Visita domiciliaria}
        - {doc: paz_salvo}
        - {doc: cert_tradicion}
        - {doc: escritura, texto: Fotocopia de la escritura}
        - {doc: solicitud_tramite}
        - {doc: declaracion_extrajuicio, opcional: true, texto: "Declaración extrajuicio en notaría de renuncia a mejoras (si tiene ensanche)"}
        - {doc: identificacion, texto: Fotocopia de la cédula del propietario}
        - {doc: camara_comercio, cond: juridica}

    publicidad_exterior:
      titulo: Publicidad visual exterior
      tipos: [publicidad_exterior]
      requisitos:
        - {doc: pago_tramite, texto: Pago de publicidad visual}
        - {doc: autorizacion_propietario}
        - {doc: formato_publicidad}

    inscripcion_profesionales:
      titulo: Inscripción de profesionales
      tipos: [inscripcion_profesionales]
      requisitos:
        - {doc: identificacion, texto: Copia del documento de identidad}
        - {doc: profesionales, texto: Copia de la matrícula profesional}
        - {doc: formato_inscripcion_profesionales}
  fuente: {norma: Listado de requisitos de la Secretaría de Planeación y Desarrollo Territorial, articulo: "Documentos por trámite (versión 2026-11-23)"}
