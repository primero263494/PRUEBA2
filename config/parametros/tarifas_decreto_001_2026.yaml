    valor: valor_decreto
    opciones:
      - {id: millar_superior, etiqueta: "Al millar superior siguiente (art. 2 Decreto 001/2026)"}
      - {id: valor_decreto, etiqueta: "Usar siempre el valor ajustado publicado en la tabla"}
      - {id: sin_redondeo, etiqueta: "Sin redondeo (UVT × factor)"}
    nota: Por defecto se aplica el valor publicado en la tabla del decreto (es el acto oficial). Cambie a 'millar_superior' si Hacienda decide aplicar la regla del art. 2; cada tarifa también se puede modificar una por una.
    fuente: {norma: Decreto 001 de 2026, articulo: "2"}

