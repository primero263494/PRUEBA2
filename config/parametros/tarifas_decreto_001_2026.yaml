# =============================================================================
# TARIFAS 2026 — Decreto Municipal 001 del 8 de enero de 2026
# Base legal: Acuerdo 019 de 2020 (mod. Acuerdos 015/2024 y 006/2025).
#
# Para cada tarifa se guardan:
#   uvt          factor en UVT del decreto
#   calculado    valor del decreto antes de redondear (UVT × factor)
#   decreto      "valor ajustado" publicado en el decreto
#   valor        el que el programa APLICA (por defecto = decreto; editable)
#   nota         advertencia cuando el ajustado no respeta la regla de
#                redondeo hacia arriba del art. 2 del mismo decreto
# =============================================================================

metadatos:
