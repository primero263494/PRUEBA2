  nota: Claves = grupo de uso.
  fuente: {norma: NSR-10, articulo: "Tabla A.2.5-1"}

espectro_diseno:
  formulas:
    valor:
      T0: "0.10 * Av * Fv / (Aa * Fa)"
      TC: "0.48 * Av * Fv / (Aa * Fa)"
      TL: "2.4 * Fv"
      Sa_meseta: "2.5 * Aa * Fa * I"
      Sa_TC_TL: "1.2 * Av * Fv * I / T"
      Sa_mayor_TL: "1.2 * Av * Fv * TL * I / T**2"
    fuente: {norma: NSR-10, articulo: "A.2.6 (ecs. A.2.6-1 a A.2.6-6)"}

