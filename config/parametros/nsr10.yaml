# =============================================================================
# NSR-10 — Reglamento Colombiano de Construcción Sismo Resistente
# Decreto 926 de 2010 y sus modificaciones (entre otras: Decretos 092/2011,
# 1711/2021 y 1401/2023).
#
# Valores tomados del texto publicado en línea (Títulos A y H, versión que
# hospeda el IDRD), consultados el 2026-11-23. Ninguno se escribió de memoria.
# Antes de un concepto definitivo, verifique que ninguna modificación posterior
# cambió el valor del municipio (Apéndice A-4) o la tabla citada.
# =============================================================================

metadatos:
  norma: NSR-10 (Decreto 926 de 2010 y modificaciones)
  consultado: "2026-11-23"
  fuentes_en_linea:
    titulo_a: https://www.idrd.gov.co/sites/default/files/documentos/Construcciones/titulo-a-nsr-100.pdf
    titulo_h: https://www.idrd.gov.co/sites/default/files/documentos/Construcciones/8titulo-h-nsr-100.pdf
  modificaciones_conocidas:
    - Decreto 1711 de 2021 (modifica, entre otros, Apéndice A-4 para Supía y Apéndice F.4-A)
    - Decreto 1401 de 2023 (modificación parcial)
    - Directiva Procuraduría 015 de 2026 (seguimiento a la actualización; NSR-10 sigue vigente)
  nota: >-
    En 2025 la AIS entregó el borrador AIS 100-24 a la Comisión Asesora
    Permanente; mientras no se adopte por decreto rige la NSR-10.

