# =============================================================================
# PARÁMETROS DEL PBOT — Acuerdo Municipal 012 de 2017, El Carmen de Viboral
# Primer nivel de prevalencia municipal.
#
# Convención: cada parámetro es un bloque con "valor". Opcionales:
#   unidad, fuente (norma + articulo), nota, opciones (lista elegible),
#   editable (por defecto true). Los grupos sin "valor" solo organizan.
# Si cambia la norma, edite este archivo (o use la página "Parámetros" del
# programa, que guarda el cambio con usuario, fecha y motivo).
# =============================================================================

metadatos:
  norma: Acuerdo Municipal 012 de 2017 (PBOT)
  fecha_norma: "2017-10-17"
  prevalencia: 1

aprovechamientos:
  tabla_poligonos:
    valor: aprovechamientos_art138.csv
    nota: >-
      Tabla de 59 polígonos extraída del art. 138 (verificada contra la imagen de
      la pág. 156). Columnas: densidad básica y adicional, pisos base y
      adicionales, IC, IO urbanismos, IO lotes individuales.
    fuente: {norma: Acuerdo 012 de 2017, articulo: "138"}
  pisos_maximos_lote_mayor_800:
    valor: 8
    unidad: pisos
    nota: >-
      Lotes > 800 m² en consolidación y desarrollo urbano, si cumplen cesiones
      A, B y C y pagan plusvalía.
    fuente: {norma: Acuerdo 012 de 2017, articulo: "138 nota (****)"}
  area_lote_para_8_pisos:
    valor: 800
    unidad: m²
    fuente: {norma: Acuerdo 012 de 2017, articulo: "138 nota (****)"}
  tanque_agua_desde_niveles:
    valor: 3
    unidad: niveles
    fuente: {norma: Acuerdo 012 de 2017, articulo: "138 par. 2"}
  altura_unidad_piso_residencial:
    valor: 2.50
    unidad: m
    nota: Piso acabado a enrase de techo o cielo raso acabado.
    fuente: {norma: Acuerdo 012 de 2017, articulo: "193"}
  semisotano_altura_maxima_sobre_anden:
    valor: 1.50
    unidad: m
    nota: Si la supera, cuenta como piso. Se mide desde el nivel 0:0 del andén.
    fuente: {norma: Acuerdo 012 de 2017, articulo: "179 y 193"}
  parqueaderos_cubiertos_sin_cerramiento_en_io:
    valor: 0.50
    unidad: fracción
    nota: Se contabiliza el 50 % del área de parqueaderos cubiertos sin cerramientos laterales.
    fuente: {norma: Acuerdo 012 de 2017, articulo: "137 (Índice de Ocupación)"}

# -----------------------------------------------------------------------------
# DEFINICIONES EN CONFLICTO: el programa ofrece las versiones como lista.
# La opción elegida por defecto es la del PBOT (prevalencia) salvo que la
# Secretaría escoja otra en la página "Parámetros".
# -----------------------------------------------------------------------------
definiciones:
  area_neta:
    valor: pbot_art137
    opciones:
      - id: pbot_art137
        etiqueta: "PBOT art. 137 / Decreto 1077 art. 2.2.1.1"
        formula: "Área bruta − (sistema vial principal + redes primarias + áreas de conservación y protección)"
        nota: >-
          No se descuentan cesiones, retiros a vías, laterales, de fondo ni a
          quebradas. Coincide con la definición nacional.
      - id: decreto_tarifas_2026
        etiqueta: "Decreto 001 de 2026 (liquidación de urbanización y parcelación)"
        formula: "Área total del lote − (retiros + vías obligadas)"
        nota: Úsela solo para liquidar la expensa de urbanización/parcelación.
      - id: manual_tramites
        etiqueta: "Manual de trámites interno (cap. 3.1)"
        formula: "Área bruta − (afectaciones viales arteriales + redes primarias + suelos de protección/EEP)"
        nota: Variante del manual interno; no es norma.
    nota: >-
      Tres definiciones distintas. El programa calcula las tres y muestra cuál
      se aplicó. Criterio por jerarquía: Ley 388/Decreto 1077 > PBOT > decretos
      municipales.
    fuente: {norma: Acuerdo 012 de 2017, articulo: "137"}
  base_indice_ocupacion:
    valor: area_total_predio
    opciones:
      - id: area_total_predio
        etiqueta: "Área total del predio (PBOT art. 137; Decreto 1077 art. 2.2.1.1)"
      - id: area_neta_descontada
        etiqueta: "Área bruta − vías principales, redes primarias, protección y demás afectaciones (Decreto 1077 art. 2.2.6.2.5)"
      - id: manual_neta_menos_retiros
        etiqueta: "Área neta menos afectaciones y retiros (manual interno)"
    fuente: {norma: Acuerdo 012 de 2017, articulo: "137"}
  base_indice_construccion:
    valor: segun_tramite
    opciones:
      - id: segun_tramite
        etiqueta: "Urbanizaciones: área bruta; lotes de urbanizaciones existentes: área neta (PBOT art. 137)"
      - id: area_util
        etiqueta: "Área útil (PBOT art. 137, primera frase)"
      - id: area_total_predio
        etiqueta: "Área total del predio (Decreto 1077 art. 2.2.1.1)"
    fuente: {norma: Acuerdo 012 de 2017, articulo: "137"}

indice_construccion_maximo:
  valor: 2.5
  opciones:
    - id: "2.5"
      valor: 2.5
      etiqueta: "2,5 — tabla de tratamientos (PBOT art. 138)"
    - id: "4.0"
      valor: 4.0
      etiqueta: "4,0 — autorización especial de Planeación (D152 art. 39 par. 7)"
      advertencia: >-
        El Decreto 152 es de menor jerarquía que el PBOT. Use esta opción solo
        con acto de autorización y soporte jurídico; nunca supera la altura del
        polígono ni la del art. 57 del D152.
  unidad: veces
  fuente: {norma: Acuerdo 012 de 2017, articulo: "138"}

