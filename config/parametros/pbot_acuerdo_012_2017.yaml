      326 clases CIIU Rev. 4 A.C. con su categoría en cada área de actividad
      (Uso social obligado, Residencial, Comercio y servicios, Artesanal),
      extraídas por coordenadas de la tabla del art. 123 (págs. 132–147).
      SC = sin clasificación en la tabla: se entiende no permitido (par. 1).
    fuente: {norma: Acuerdo 012 de 2017, articulo: "120 a 123"}
  convenciones:
    valor: {P: Principal, C: Complementario, R: Restringido, PH: Prohibido, SC: "Sin clasificación (no permitido, par. 1)"}
    fuente: {norma: Acuerdo 012 de 2017, articulo: "121 y 123"}
  areas_actividad:
    valor:
      uso_social_obligado: Equipamientos y espacio público, incluye parques lineales La Cimarrona y La Madera.
      residencial: Vivienda en todas sus tipologías; usos distintos a vivienda no superan el 30 % en nuevos desarrollos.
      comercio_servicios: Actividad económica de escala municipal y zonal; la vivienda no puede ser inferior al 20 %.
      artesanal: Cerámica, forja, carpintería y similares a pequeña y mediana escala.
      ambiental: Suelos de protección urbanos asociados a fuentes hídricas (parques lineales).
    fuente: {norma: Acuerdo 012 de 2017, articulo: "119"}
  max_otros_usos_en_residencial: {valor: 0.30, unidad: fracción de la edificabilidad, fuente: {norma: Acuerdo 012 de 2017, articulo: "119"}}
  min_vivienda_en_comercio: {valor: 0.20, unidad: fracción, fuente: {norma: Acuerdo 012 de 2017, articulo: "119"}}
  distancia_licor_a_colegios: {valor: 100, unidad: m, fuente: {norma: Acuerdo 012 de 2017, articulo: "123 par. 2"}}

